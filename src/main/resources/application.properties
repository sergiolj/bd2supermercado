spring.application.name=grocerystore

# Carrega as variáveis do arquivo .env na raiz do projeto (não versionado).
# Crie o seu copiando o .env.example. Variáveis de ambiente do sistema também funcionam e têm prioridade.
spring.config.import=optional:file:.env[.properties]

# Porta da API (API_PORT é a mesma variável usada pelo docker-compose.yml).
server.port=${API_PORT:8080}

# PostgreSQL Database Configuration
# DB_PORT é a mesma variável usada pelo docker-compose.yml; DB_URL, se definida, substitui a URL inteira.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/grocery}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate specific configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Paginação (vale para qualquer endpoint que receba Pageable): ?page=0&size=20&sort=campo,asc
# size acima do máximo é reduzido para o máximo, sem erro.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Regras de loja e triggers do estoque (PL/pgSQL, só PostgreSQL): rodam depois que o Hibernate cria as tabelas.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/store_constraints.sql,classpath:db/inventory_trigger.sql
spring.sql.init.separator=;;
spring.sql.init.encoding=UTF-8
