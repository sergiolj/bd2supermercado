spring.application.name=grocerystore

spring.datasource.url=jdbc:postgresql://localhost:5432/grocery
spring.datasource.username=admin_grocery
spring.datasource.password=admin

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate specific configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicit dialect (Also optional, Spring Boot infers from the connection)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect