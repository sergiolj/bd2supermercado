# Perfil "seed": alem dos triggers do estoque, carrega os dados de exemplo (db/seed.sql).
# O seed e idempotente (ignora a carga se o banco ja tiver fornecedores/vendas/estoque), entao pode
# ficar ligado sem risco de duplicar dados.
#
#   ./mvnw -Pseed                                                   (popula e encerra; ver profile "seed" no pom.xml)
#   ./mvnw spring-boot:run "-Dspring-boot.run.profiles=seed"        (popula e mantem a aplicacao no ar)
#
# A ordem importa: primeiro os triggers, depois o seed (o seed so insere inventory_movement e deixa
# o trigger montar o inventory).
spring.sql.init.schema-locations=classpath:db/inventory_trigger.sql,classpath:db/seed.sql
